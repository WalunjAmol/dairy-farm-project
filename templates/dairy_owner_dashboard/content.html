{% extends 'dairy_owner_dashboard/base.html' %}
{% load static %}{% load static i18n %}
{% block content %}
    <title>Coming Soon Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }

        .container h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
        }

        .container p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }
      
        .graph {
            width: 100%;
            max-width: 550px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .half-screen {
            width: 50%;
            float: left;
            box-sizing: border-box;
            padding: 0 10px;
        }
        .header-text {
            font-size: 36px !important;
            color: #4CAF50 !important; /* Green color */
            margin-bottom: 20px !important;
            animation: fadeInUp 1s ease-in-out !important;
        }
        
        .sub-text {
            font-size: 18px !important;
            color: #FFC107 !important; /* Yellow color */
            margin-bottom: 30px !important;
            animation: fadeInUp 1s ease-in-out !important;
            animation-delay: 0.5s !important; /* Delay the animation */
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
    </style>
    <div class="container">
        <h1 class="header-text">Coming Soon Dashboard</h1>
        <p class="sub-text">We're working on something great. Stay tuned for updates!</p>
        <div class="half-screen">
            <canvas id="milkProductionGraph" class="graph"></canvas>
        </div>
        <div class="half-screen">
            <canvas id="salesGraph" class="graph"></canvas>
        </div>
        <div class="half-screen">
            <canvas id="anotherGraph1" class="graph"></canvas>
        </div>
        <div class="half-screen">
            <canvas id="anotherGraph2" class="graph"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Sample data for the milk production graph
        const milkProductionData = {
            labels: ['January', 'February', 'March', 'April', 'May', 'June'],
            datasets: [{
                label: 'Milk Production (in liters)',
                data: [500, 620, 480, 550, 600, 520],
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        };

        const milkProductionConfig = {
            type: 'bar',
            data: milkProductionData,
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            display: false
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        const milkProductionCtx = document.getElementById('milkProductionGraph').getContext('2d');
        const milkProductionChart = new Chart(milkProductionCtx, milkProductionConfig);

        // Sample data for the sales graph
        const salesData = {{milk_production_data | safe}}
        
        const salesConfig = {
            type: 'line',
            data: salesData,
            options: {
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: {
                            display: false
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        const salesCtx = document.getElementById('salesGraph').getContext('2d');
        const salesChart = new Chart(salesCtx, salesConfig);
        const anotherGraph1Data = {
            labels: ['January', 'February', 'March', 'April', 'May', 'June'],
            datasets: [{
                label: 'Data 1',
                data: [300, 350, 400, 420, 380, 450],
                backgroundColor: 'rgba(75, 192, 192, 0.6)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        };

        const anotherGraph1Config = {
            type: 'bar',
            data: anotherGraph1Data,
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            display: false
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        const anotherGraph1Ctx = document.getElementById('anotherGraph1').getContext('2d');
        const anotherGraph1Chart = new Chart(anotherGraph1Ctx, anotherGraph1Config);

        const anotherGraph2Data = {
            labels: ['January', 'February', 'March', 'April', 'May', 'June'],
            datasets: [{
                label: 'Data 2',
                data: [200, 250, 270, 300, 280, 320],
                backgroundColor: 'rgba(255, 206, 86, 0.6)',
                borderColor: 'rgba(255, 206, 86, 1)',
                borderWidth: 1
            }]
        };

        const anotherGraph2Config = {
            type: 'line',
            data: anotherGraph2Data,
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            display: false
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        };

        const anotherGraph2Ctx = document.getElementById('anotherGraph2').getContext('2d');
        const anotherGraph2Chart = new Chart(anotherGraph2Ctx, anotherGraph2Config);
    
    </script>


{% endblock content %}
